<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text="Voltar"></ion-back-button>
    </ion-buttons>
    <ion-title>Recuperar Senha</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="bgd-container ion-padding">
    <ion-grid>
      <ion-row class="ion-justify-content-center">
        <ion-col size="12" sizeMd="8" sizeLg="5">
          <div class="bgd-card recovery-card">
            <div class="icon-circle">
              <ion-icon name="key-outline"></ion-icon>
            </div>

            <h2>Redefinir sua senha</h2>
            <p>
              Informe o e-mail vinculado à sua conta BGD Cash para receber o link de recuperação.
            </p>

            @if (!sent()) {
              <ion-item lines="none" class="bgd-input-item">
                <ion-icon slot="start" name="mail-outline" color="medium"></ion-icon>
                <ion-input
                  label="E-mail cadastrado"
                  labelPlacement="stacked"
                  type="email"
                  [ngModel]="email()"
                  (ngModelChange)="email.set($event)"
                ></ion-input>
              </ion-item>

              <ion-button
                expand="block"
                shape="round"
                size="large"
                color="primary"
                (click)="onSendRecovery()"
              >
                Enviar Link de Recuperação
              </ion-button>
            } @else {
              <div class="sent-box">
                <ion-icon name="checkmark-circle"></ion-icon>
                <strong>Instruções enviadas!</strong>
                <p>Verifique a caixa de entrada de <strong>{{ email() }}</strong>.</p>
              </div>
            }

            <ion-button
              expand="block"
              fill="clear"
              color="medium"
              routerLink="/login"
              class="back-login-btn"
            >
              Voltar para a Tela de Login
            </ion-button>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
